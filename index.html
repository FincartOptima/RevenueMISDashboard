<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Revenue MIS — Fincart</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* ---- Cerulean Ledger palette ---- */
  --paper:#ECEFF1;--surface:#fff;--surface-tint:#CFD8DC;--row-tint:#E4E9EC;--row-hover:#B0BEC5;
  --ink:#263238;--subink:#607D8B;--line:#90A4AE;--rail:#37474F;
  --cerulean:#78909C;--blue-sentinel:#546E7A;
  --teal-status:#00897B;--teal-status-bg:#E0F2F1;
  --slate-status:#A6771F;--slate-status-bg:#F3E7CC;
  --steel-status:#607D8B;--steel-status-bg:#E1E9EC;
  --loss:#9C4147;--loss-bg:#F3E1E2;

  /* legacy aliases — keep existing component classes working under the new palette */
  --bg:var(--paper);--panel:var(--surface);--panel2:var(--row-tint);
  --text:var(--ink);--muted:var(--subink);
  --primary:var(--cerulean);--primary-dark:var(--blue-sentinel);--primary-light:var(--row-tint);

  /* KPI / chart category accents, retinted to the ledger palette */
  --orange:var(--slate-status);--red:var(--loss);--yellow:#B08D3D;--pink:#7E6A8C;
  --blue:var(--blue-sentinel);--green:var(--teal-status);--violet:#6B5B73;--cyan:#4F7C82;--teal:var(--teal-status);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font:13px/1.55 'Inter',system-ui,sans-serif}
h1,h2,h3{font-weight:600}

#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--rail);text-align:center;padding:24px}
#loading .l-logo{font-family:'Fraunces',serif;font-size:30px;font-weight:600;color:#fff;letter-spacing:-.3px}
#loading .l-logo em{color:var(--cerulean);font-style:italic}
#loading .l-spinner{width:26px;height:26px;border:2px solid rgba(255,255,255,.18);border-top-color:var(--cerulean);border-radius:50%;animation:l-spin .8s linear infinite}
#loading .l-msg{color:#90A4AE;font-size:11px;max-width:520px;line-height:1.7;font-family:'IBM Plex Mono',monospace}
@keyframes l-spin{to{transform:rotate(360deg)}}

button{background:var(--cerulean);color:#fff;border:1px solid var(--cerulean);border-radius:0;padding:7px 16px;font:600 11px/1 'Inter',sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
button:hover{background:var(--blue-sentinel);border-color:var(--blue-sentinel)}
button.secondary{background:transparent;color:var(--blue-sentinel);border:1px solid var(--blue-sentinel)}
button.secondary:hover{background:var(--blue-sentinel);color:#fff}
input[type=text],input[type=number],select{background:transparent;color:var(--ink);border:none;border-bottom:1px solid var(--line);padding:5px 2px;font:13px/1.3 'Inter',sans-serif;border-radius:0}
input[type=text]:focus,input[type=number]:focus,select:focus{outline:none;border-bottom:2px solid var(--cerulean)}
select{min-width:110px}
label.upload-btn{display:inline-flex;align-items:center;padding:7px 16px;cursor:pointer;border:1px solid var(--blue-sentinel);background:transparent;color:var(--blue-sentinel);font:600 11px/1 'Inter',sans-serif;text-transform:uppercase;letter-spacing:.06em}
label.upload-btn:hover{background:var(--blue-sentinel);color:#fff}

/* ---- shell: sidebar rail + main ---- */
#app{display:none}
.shell{display:flex;min-height:100vh;align-items:stretch}
.rail{width:240px;flex:none;background:var(--rail);color:#CFD8DC;display:flex;flex-direction:column;position:sticky;top:0;align-self:flex-start;height:100vh}
.rail-brand{padding:26px 20px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.rail-logo{height:26px;width:auto;object-fit:contain;margin-bottom:12px;filter:brightness(0) invert(1);opacity:.92}
.rail-brand-name{font-family:'Fraunces',serif;font-size:21px;font-weight:600;color:#fff;letter-spacing:-.2px;line-height:1.15}
.rail-brand-name em{color:var(--cerulean);font-style:italic}
.rail-brand-tag{font-size:9px;color:#78909C;margin-top:6px;text-transform:uppercase;letter-spacing:.12em}
.rail-nav{flex:1;overflow-y:auto;padding:14px 0}
.tab{display:flex;align-items:baseline;gap:11px;width:100%;background:transparent;border:0;border-left:2px solid transparent;padding:11px 20px;cursor:pointer;text-align:left}
.tab .tab-no{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#607D8B;flex:none}
.tab .tab-lbl{font:500 12px/1.3 'Inter',sans-serif;color:#B0BEC5}
.tab:hover{background:rgba(255,255,255,.05)}
.tab:hover .tab-lbl{color:#fff}
.tab.active{border-left-color:var(--cerulean);background:rgba(255,255,255,.06)}
.tab.active .tab-no{color:var(--cerulean)}
.tab.active .tab-lbl{color:#fff}
.rail-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.1)}
.rail-foot-label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#607D8B;margin-bottom:5px}
.rail-foot-val{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#90A4AE;line-height:1.5;word-break:break-word}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.filters{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.filters label{font-size:10px;font-weight:600;color:var(--subink);text-transform:uppercase;letter-spacing:.08em;margin-right:2px}
.topbar .spacer{flex:1}
.last-updated{display:flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--line);white-space:nowrap}
.last-updated-dot{width:6px;height:6px;border-radius:50%;background:#66BB6A;flex:none}
.last-updated-dot.stale{background:#EF9A9A}
.last-updated-label{font-size:9px;font-weight:600;color:var(--subink);text-transform:uppercase;letter-spacing:.1em}
.last-updated-val{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink)}

@media(max-width:768px){
  .shell{flex-direction:column}
  .rail{width:100%;height:auto;position:sticky;top:0;flex-direction:row;align-items:stretch;z-index:30}
  .rail-brand{border-bottom:0;border-right:1px solid rgba(255,255,255,.1);padding:12px 16px;flex:none;white-space:nowrap;display:flex;flex-direction:column;justify-content:center}
  .rail-brand-tag{display:none}
  .rail-logo{margin-bottom:4px}
  .rail-nav{display:flex;overflow-x:auto;padding:0}
  .tab{border-left:0;border-bottom:2px solid transparent;padding:12px 14px;white-space:nowrap}
  .tab.active{border-left-color:transparent;border-bottom-color:var(--cerulean)}
  .rail-foot{display:none}
}

.tab-panel{display:none;padding:20px 24px;max-width:1700px;margin:0 auto;width:100%}
.tab-panel.active{display:block}

/* ---- underline tab bars: view-switcher + metric pills ---- */
.view-bar{display:flex;gap:22px;margin-bottom:18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.vbtn{padding:8px 1px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--subink);font:600 11px/1 'Inter',sans-serif;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;margin-bottom:-1px}
.vbtn:hover:not(.active){color:var(--ink)}
.vbtn.active{border-bottom-color:var(--cerulean);color:var(--cerulean)}

.metric-bar,.dash-metric-bar{display:flex;gap:20px;margin-bottom:14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.mpill,.dash-mpill{padding:6px 1px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--subink);font:600 10px/1 'Inter',sans-serif;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;border-radius:0;margin-bottom:-1px}
.mpill:hover:not(.active),.dash-mpill:hover:not(.active){color:var(--ink)}
.mpill.active,.dash-mpill.active{border-bottom-color:var(--cerulean);color:var(--cerulean)}

.section{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);padding:16px 18px;margin-bottom:16px}
.section.bar-green{border-left-color:var(--teal-status)}.section.bar-blue{border-left-color:var(--blue-sentinel)}
.section.bar-pink{border-left-color:var(--pink)}.section.bar-red{border-left-color:var(--loss)}
.section.bar-yellow{border-left-color:var(--slate-status)}.section.bar-violet{border-left-color:var(--violet)}
.section.bar-cyan{border-left-color:var(--cyan)}.section.bar-orange{border-left-color:var(--slate-status)}
.section.bar-teal{border-left-color:var(--teal-status)}.section.bar-primary{border-left-color:var(--cerulean)}
.section h2{font:700 10px/1 'Inter',sans-serif;text-transform:uppercase;letter-spacing:.16em;color:var(--cerulean);margin-bottom:12px}
.section .hint{color:var(--subink);font-size:11px;margin-top:6px}

.grid{display:grid;gap:16px}
.grid.cols-2{grid-template-columns:1fr 1fr}.grid.cols-3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:1100px){.grid.cols-2,.grid.cols-3{grid-template-columns:1fr}}

/* ---- KPI cards ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:16px}
.ins-product-kpis{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.ins-product-kpis .kpi{padding:9px 11px}
.ins-product-kpis .kpi-value{font-size:14px}
.ins-product-kpis .kpi-label{font-size:8px}
.kpi{background:var(--surface);padding:14px 16px;border-top:2px solid var(--line)}
.kpi-value{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;line-height:1;letter-spacing:-.2px;color:var(--ink)}
.kpi-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--subink);margin-top:6px}
.kpi-orange{border-top-color:var(--slate-status)}
.kpi-red{border-top-color:var(--loss)}
.kpi-yellow{border-top-color:var(--yellow)}
.kpi-pink{border-top-color:var(--pink)}
.kpi-blue{border-top-color:var(--blue-sentinel)}
.kpi-green{border-top-color:var(--teal-status)}
.kpi-violet{border-top-color:var(--violet)}
.kpi-cyan{border-top-color:var(--cyan)}
.kpi-teal{border-top-color:var(--teal-status)}
.kpi-primary{border-top-color:var(--cerulean)}

/* ---- tables ---- */
.table-wrap{overflow:auto;max-height:460px;border:1px solid var(--line)}
.table-wrap.tall{max-height:560px}
.table-wrap::-webkit-scrollbar{width:6px;height:6px}
.table-wrap::-webkit-scrollbar-thumb{background:var(--cerulean)}
.table-wrap::-webkit-scrollbar-track{background:var(--row-tint)}
.num,.badge{font-variant-numeric:tabular-nums}
table.data{border-collapse:collapse;width:100%;font-size:12px;background:var(--surface)}
table.data.compact{font-size:11px}
table.data th,table.data td{padding:7px 10px;border:1px solid var(--line);text-align:right;white-space:nowrap;font-family:'Inter',sans-serif}
table.data td[style*="right"],table.data .num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
table.data th:first-child,table.data td:first-child{text-align:left;position:sticky;left:0;background:var(--surface-tint);z-index:1;font-family:'Inter',sans-serif}
table.data thead th{background:var(--surface-tint);color:var(--ink);font:700 10px/1 'Inter',sans-serif;text-transform:uppercase;letter-spacing:.06em;position:sticky;top:0;z-index:2}
table.data thead th:first-child{background:var(--surface-tint)}
table.data tbody tr:nth-child(even) td{background:var(--row-tint)}
table.data tbody tr:nth-child(even) td:first-child{background:var(--surface-tint)}
table.data tbody tr:hover td{background:var(--row-hover)}
table.data tbody tr.grand td{font-weight:700;background:var(--surface-tint)!important;color:var(--ink);border-top:2px solid var(--cerulean);border-bottom:2px solid var(--cerulean)}
table.data td.rank{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--subink);font-size:10px;width:28px}
tr.heat-high td{background:rgba(0,137,123,.12)!important}
tr.heat-mid td{background:rgba(84,110,122,.10)!important}
tr.heat-low td{background:rgba(166,119,31,.12)!important}
tr.heat-vlow td{background:rgba(156,65,71,.10)!important}

.chart-wrap{background:var(--surface);border:1px solid var(--line);padding:14px;height:300px;margin-bottom:0}
.chart-wrap.h400{height:380px}.chart-wrap.h460{height:440px}
.meta{color:var(--subink);font-size:11px;margin-bottom:6px;font-family:'IBM Plex Mono',monospace}
.sort-icon{font-size:8px;margin-left:2px;color:var(--cerulean)}
table.data th.sortable{cursor:pointer}
table.data th.sortable:hover{color:var(--cerulean)}
.raw-filters{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.raw-filters select{font-size:11px}
.raw-filters input[type=text]{font-size:11px;min-width:200px}

/* ---- badges ---- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:3px;font:600 10px/1.6 'Inter',sans-serif;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.badge-positive{background:var(--teal-status-bg);color:var(--teal-status)}
.badge-warning{background:var(--slate-status-bg);color:var(--slate-status)}
.badge-neutral{background:var(--steel-status-bg);color:var(--steel-status)}
.badge-negative{background:var(--loss-bg);color:var(--loss)}

/* ---- info button + popup ---- */
.info-btn{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border:1px solid var(--subink);background:transparent;color:var(--subink);font-size:10px;font-weight:700;cursor:pointer;vertical-align:middle;margin-left:6px;padding:0;font-family:'Fraunces',serif;font-style:italic;line-height:1;border-radius:50%}
.info-btn:hover{background:var(--cerulean);color:#fff;border-color:var(--cerulean)}
.info-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;background:var(--surface);border:1px solid var(--cerulean);padding:20px 24px;max-width:540px;width:90%;max-height:80vh;overflow-y:auto;color:var(--ink)}
.info-popup h3{margin:0 0 10px;font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:var(--ink)}
.info-popup p{margin:4px 0;font-size:12px;line-height:1.6;color:var(--ink)}
.info-popup .info-label{font-weight:600;color:var(--subink);font-size:9px;text-transform:uppercase;letter-spacing:.1em;margin-top:10px;display:block}
.info-popup .close-info{position:absolute;top:10px;right:14px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--subink);line-height:1;padding:0}
.info-popup .close-info:hover{color:var(--ink)}
.info-overlay{position:fixed;inset:0;z-index:9998;background:rgba(38,50,56,.4)}

/* ---- Excel-like raw column filters ---- */
.raw-filter-head{display:flex;align-items:center;gap:4px;justify-content:flex-start;flex-wrap:wrap}
.raw-filter-btn{background:transparent;border:1px solid var(--line);color:var(--subink);padding:1px 5px;font-size:9px;cursor:pointer;line-height:1.6;min-width:18px;border-radius:0}
.raw-filter-btn:hover{background:var(--rail);color:#fff;border-color:var(--rail)}
.raw-filter-btn.active{background:var(--cerulean);border-color:var(--cerulean);color:#fff}
.raw-filter-selected{font-size:9px;color:var(--cerulean);font-weight:700;margin-top:2px;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'IBM Plex Mono',monospace}
.raw-filter-menu{position:fixed;background:var(--surface);border:1px solid var(--cerulean);z-index:9000;max-height:360px;display:flex;flex-direction:column;overflow:hidden;min-width:190px}
.raw-filter-title{font:700 11px/1 'Inter',sans-serif;padding:9px 12px;border-bottom:1px solid var(--line);color:var(--ink);background:var(--surface-tint);text-transform:uppercase;letter-spacing:.06em}
.raw-filter-search{border:0;border-bottom:1px solid var(--line);padding:7px 12px;font:inherit;outline:none;border-radius:0}
.raw-filter-search:focus{border-bottom:2px solid var(--cerulean)}
.raw-filter-actions{display:flex;gap:0;border-bottom:1px solid var(--line)}
.raw-filter-actions button{flex:1;border:0;border-right:1px solid var(--line);padding:6px;font-size:10px;background:var(--row-tint);color:var(--ink);border-radius:0;text-transform:none;letter-spacing:0}
.raw-filter-actions button:hover{background:var(--row-hover)}
.raw-filter-actions button:last-child{border-right:0}
.raw-filter-options{overflow-y:auto;flex:1;max-height:200px}
.raw-filter-option{display:flex;align-items:center;gap:7px;padding:6px 12px;cursor:pointer;font-size:11px}
.raw-filter-option:hover{background:var(--row-tint)}
.raw-filter-option input{accent-color:var(--cerulean);cursor:pointer}
.raw-filter-option span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.raw-filter-empty{padding:10px 12px;color:var(--subink);font-size:11px}
.raw-filter-footer{display:flex;gap:0;border-top:1px solid var(--line)}
.raw-filter-footer button{flex:1;border:0;border-right:1px solid var(--line);padding:7px;font-size:10px;background:var(--surface);color:var(--cerulean);font-weight:700;border-radius:0;text-transform:uppercase;letter-spacing:.06em}
.raw-filter-footer button:hover{background:var(--cerulean);color:#fff}
.raw-filter-footer button:last-child{border-right:0}

/* ---- page-level controls bar (dashboard / ins / fees / pms) ---- */
.dash-controls-bar{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.dash-filter-group{display:flex;gap:8px;align-items:baseline}
.dash-filter-group label{font-size:10px;font-weight:600;color:var(--subink);text-transform:uppercase;letter-spacing:.08em}
.dash-filter-group select{min-width:120px;font-size:12px}

/* ---- KPI trio (Target / Achieved / %) ---- */
.kpi-trio{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--line);padding:16px 18px}
.kpi-trio-title{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--subink);margin-bottom:10px}
.kpi-trio-row{display:flex}
.kpi-trio-item{flex:1;text-align:center;border-left:1px solid var(--line)}
.kpi-trio-item:first-child{border-left:0}
.kpi-trio-val{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;line-height:1;letter-spacing:-.2px;color:var(--ink)}
.kpi-trio-lbl{font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--subink);margin-top:5px}
.kpi-trio-primary{border-top-color:var(--cerulean)}
.kpi-trio-blue{border-top-color:var(--blue-sentinel)}
.kpi-trio-green{border-top-color:var(--teal-status)}
.kpi-trio-orange{border-top-color:var(--slate-status)}
.kpi-trio-violet{border-top-color:var(--violet)}
.kpi-trio-cyan{border-top-color:var(--cyan)}
.kpi-trio-teal{border-top-color:var(--teal-status)}
.kpi-trio-red{border-top-color:var(--loss)}
.kpi-trio-pink{border-top-color:var(--pink)}
</style>
</head>
<body>

<div id="loading">
  <div class="l-logo">Revenue <em>MIS</em></div>
  <div class="l-spinner"></div>
  <div class="l-msg" id="loading-msg">Connecting to GitHub…</div>
</div>

<div id="app">
  <div class="shell">
    <nav class="rail">
      <div class="rail-brand">
        <img src="logo.png" class="rail-logo" alt="Fincart Logo" onerror="this.style.display='none'">
        <div class="rail-brand-name">Revenue <em>MIS</em></div>
        <div class="rail-brand-tag">Fincart Optima — Revenue Ledger</div>
      </div>
      <div id="tabs" class="rail-nav"></div>
      <div class="rail-foot">
        <div class="rail-foot-label">Source</div>
        <div class="rail-foot-val" id="app-subtitle">—</div>
      </div>
    </nav>

    <div class="main">
      <header class="topbar">
        <div class="filters">
          <span id="header-talk-filters" style="display:none">
            <label>Period</label>
            <select id="filter-talkmonth"></select>
            <label>Team</label>
            <select id="filter-chart-team"><option value="All">All Teams</option></select>
          </span>
        </div>
        <div class="spacer"></div>
        <div class="last-updated" id="last-updated" title="">
          <span class="last-updated-dot" id="last-updated-dot"></span>
          <span class="last-updated-label">Last Updated</span>
          <span class="last-updated-val" id="last-updated-val">—</span>
        </div>
        <label class="upload-btn">Re-upload .xlsb
          <input type="file" id="reupload-file" accept=".xlsb,.xlsx,.xls" style="display:none">
        </label>
      </header>

      <main>
        <!-- DASHBOARD — KPIs, bar chart, data table -->
        <div class="tab-panel" id="tab-dashboard">
          <div id="dash-controls"></div>
          <div class="kpis" id="dash-kpis"></div>
          <div class="kpis" id="dash-kpis2"></div>
          <div class="section bar-primary" id="dash-chart-section">
